<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>胶国杀 · 朋友局</title>
    <link rel="stylesheet" href="/jgs/entry.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="seal">胶</span>
        <div>
          <p class="eyebrow">今晚，一起开一局</p>
          <h1>胶国杀<span>朋友局</span></h1>
        </div>
      </header>
      <section class="intro">
        <p>熟悉的牌桌，熟悉的朋友。</p>
        <div class="tags">
          <span>标准身份</span><span>标准＋军争</span><span>4–6 人</span>
        </div>
      </section>
      <section class="panel">
        <div class="panel-heading">
          <h2 id="heading">加入朋友的房间</h2>
          <span id="status" class="status">正在查看房间</span>
        </div>
        <p id="hint" class="hint">输入昵称和房主告诉你的口令，即可入座。</p>
        <button id="quick-test" class="secondary" hidden disabled>
          创建单人测试房（自动补人机）
        </button>
        <form id="entry" method="post" action="/api/join">
          <label
            >你的昵称<input
              id="nickname"
              name="nickname"
              maxlength="12"
              autocomplete="nickname"
              required
              placeholder="大家怎么称呼你"
          /></label>
          <label
            >房间口令<input
              id="password"
              name="password"
              type="password"
              minlength="4"
              maxlength="64"
              required
              autocomplete="off"
              placeholder="至少 4 位"
          /></label>
          <label id="player-label" hidden
            >本局人数<select id="players">
              <option value="4">4 人</option>
              <option value="5">5 人</option>
              <option value="6">6 人</option>
            </select></label
          >
          <label id="ai-label" hidden
            >开局方式<select id="fill-ai">
              <option value="false">全真人 · 人齐后开始</option>
              <option value="true">人机补位 · 空位由人机补齐</option>
            </select></label
          >
          <label id="pack-label" hidden
            >武将包<select id="character-pack">
              <option value="mixed">胶国杀＋标准武将</option>
              <option value="jiaoguosha">仅胶国杀 · 20 张武将牌</option>
              <option value="standard">仅标准武将</option>
            </select></label
          >
          <label id="hero-label" hidden
            >测试选将（人机房可用）<select id="test-hero">
              <option value="">正常随机选将</option>
            </select></label
          >
          <p id="error" role="alert"></p>
          <button type="submit" id="submit" disabled>
            进入房间 <span>→</span>
          </button>
        </form>
        <button id="resume" class="secondary" hidden>返回当前房间</button>
        <div id="share" hidden>
          <p>把朋友入口发给大家，口令单独告诉他们。</p>
          <input id="invite" readonly aria-label="朋友入口" /><button
            id="copy"
            class="secondary"
          >
            复制朋友入口
          </button>
        </div>
      </section>
      <footer>
        <p>有人暂离可以等一等。房主关闭游戏后，本局结束。</p>
        <small
          >已加入 20 张胶国杀武将牌 ·
          <a href="/jgs/cards.html" target="_blank" rel="noopener"
            >查看武将资料</a
          ></small
        >
        <details>
          <summary>关于本项目</summary>
          基于
          <a
            href="https://github.com/libnoname/noname"
            target="_blank"
            rel="noreferrer"
            >无名杀</a
          >
          1.11.7，采用 <a href="/LICENSE" target="_blank">GPL-3.0</a> 许可。<a
            href="https://github.com/yfz123A/jiaoguosha-online"
            target="_blank"
            rel="noreferrer"
            >项目源码</a
          >。
        </details>
      </footer>
    </main>
    <script type="module" src="/jgs/entry.js"></script>
  </body>
</html>
